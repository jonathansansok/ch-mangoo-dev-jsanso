services:
  mysql:
    image: mysql:8.4
    container_name: challenge-ok-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: oferta
      MYSQL_USER: oferta
      MYSQL_PASSWORD: ofertapass
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-prootpass']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
    name: challenge-ok-mysql-data
