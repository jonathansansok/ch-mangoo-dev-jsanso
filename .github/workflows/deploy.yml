name: Smoke test

on:
  push:
    branches: [main]

concurrency:
  group: smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway deploy and hit /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL "${{ vars.RAILWAY_PUBLIC_URL }}/api/health"; then
              echo ""
              echo "Healthcheck OK (intento $i)"
              exit 0
            fi
            echo "Esperando deploy... intento $i/30"
            sleep 10
          done
          echo "Healthcheck fallido tras 5min"
          exit 1
